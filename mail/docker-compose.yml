version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ark_mail_postgres
    environment:
      POSTGRES_DB: ark_mail
      POSTGRES_USER: ark_user
      POSTGRES_PASSWORD: ark_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mail_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark_user -d ark_mail"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailcow:
    image: mailcow/mailcow-dockerized:latest
    container_name: ark_mail_mailcow
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: mailcow
      POSTGRES_USER: mailcow
      POSTGRES_PASSWORD: mailcow_password
      MAILCOW_HOSTNAME: mail.ark.local
      LOG_LINES: 9999
    ports:
      - "8080:8080"
      - "25:25"
      - "110:110"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    volumes:
      - mailcow_data:/var/lib/docker/volumes
    networks:
      - mail_net
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark_mail_backend
    environment:
      DATABASE_URL: postgresql://ark_user:ark_password@postgres:5432/ark_mail
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRATION_HOURS: 24
      MAILCOW_API_URL: http://mailcow:8080/api/v1
      MAILCOW_API_KEY: ${MAILCOW_API_KEY:-default-key}
      RUST_LOG: ark_mail=debug,axum=debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mail_net

volumes:
  postgres_data:
  mailcow_data:

networks:
  mail_net:
    driver: bridge
